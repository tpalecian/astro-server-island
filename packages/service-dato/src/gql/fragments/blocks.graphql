fragment OnQuoteRecord on QuoteRecord {
	...Type
	name
	info: information
	copy: text {
		links {
			...OnTagRecord
			...OnEmojiRecord
			...OnThinkingRecord
			...OnWorkRecord
			...OnStudioRecord
			...OnMegaHeadingRecord
		}
		value
	}
}

fragment OnTextHalfRecord on TextHalfRecord {
	...Type
	copy: text {
		links {
			...OnTagRecord
			...OnEmojiRecord
			...OnThinkingRecord
			...OnWorkRecord
			...OnStudioRecord
			...OnMegaHeadingRecord
		}
		value
	}
}

fragment OnTextLeadRecord on TextLeadRecord {
	...Type
	pretitle
	copy: text {
		links {
			...OnTagRecord
			...OnEmojiRecord
			...OnThinkingRecord
			...OnWorkRecord
			...OnStudioRecord
			...OnMegaHeadingRecord
		}
		value
	}
	size
}

fragment OnMediaSingleRecord on MediaSingleRecord {
	...Type
	ratio
	isFullscreen: fullScreen
	displayType
	caption
	media: asset {
		...Media
	}
}

fragment OnMediaMultipleRecord on MediaMultipleRecord {
	...Type
	ratio
	slideSize
	caption
	mediaSlides: assets {
		...Media
	}
}

fragment OnCardSliderRecord on CardSliderRecord {
	...Type
	speed
	initialDirection
	cardSlides: cardSet {
		id
		title
		cards {
			...Card
		}
	}
}

fragment OnStatsRecord on StatsBlockRecord {
	...Type
	stats {
		value
		unit
		label
	}
}
