fragment OnTagRecord on TagRecord {
	id
	type: __typename
	name
	cards {
		...Card
	}
}

fragment OnEmojiRecord on EmojiRecord {
	id
	type: __typename
	title
	media {
		...Media
	}
	link {
		text
		url
		record {
			... on CategoryRecord {
				slug
			}
			... on StudioRecord {
				category {
					slug
				}
				slug
			}
			... on ThinkingRecord {
				category {
					slug
				}
				slug
			}
			... on WorkRecord {
				category {
					slug
				}
				slug
			}
			... on InfoPageRecord {
				slug
			}
		}
	}
}

fragment OnWorkRecord on WorkRecord {
	id
	type: __typename
	slug
	title
}

fragment OnThinkingRecord on ThinkingRecord {
	id
	type: __typename
	slug
	title
}

fragment OnStudioRecord on StudioRecord {
	id
	type: __typename
	slug
	title
}

fragment OnMegaHeadingRecord on MegaHeadingRecord {
	id
	type: __typename
	title
}
