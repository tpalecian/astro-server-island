fragment Type on RecordInterface {
	id
	type: _modelApiKey
}

fragment Media on FileField {
	url
	alt
	width
	height
	format
	type: mimeType
	customData
}

# Seo exists on concrete records, not RecordInterface. Define per record type.
fragment SeoCategory on CategoryRecord {
	seo {
		title
		description
		image {
			...Media
		}
	}
	seoMetaTags: _seoMetaTags {
		attributes
		tag
		content
	}
}
