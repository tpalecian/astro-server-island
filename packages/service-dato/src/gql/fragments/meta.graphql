fragment Type on RecordInterface {
	id
	type: _modelApiKey
}

fragment Media on FileField {
	url
	alt
	width
	height
	format
	type: mimeType
	customData
}

# Homepage has full seo block + _seoMetaTags. Other records only have _seoMetaTags (meta field on every record).
fragment SeoHomepage on HomepageRecord {
	seo {
		title
		description
		image {
			...Media
		}
	}
	seoMetaTags: _seoMetaTags {
		attributes
		tag
		content
	}
}
