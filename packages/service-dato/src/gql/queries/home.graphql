query Home {
	homepage {
		slug
		title
		backgroundColor {
			hex
		}
		heroWords {
			word
		}
		heroVideo {
			...Media
		}
		heroCursor
		heroVideoLink {
			text
			url
			record {
				... on CategoryRecord { slug }
				... on StudioRecord { category { slug } slug }
				... on ThinkingRecord { category { slug } slug }
				... on WorkRecord { category { slug } slug }
				... on InfoPageRecord { slug }
			}
		}
		heroLink {
			links {
				...OnWorkRecord
				...OnThinkingRecord
				...OnStudioRecord
			}
			value
		}
		...SeoHomepage
		content {
			...OnQuoteRecord
			...OnTextHalfRecord
			...OnTextLeadRecord
			...OnMediaSingleRecord
			...OnMediaMultipleRecord
			...OnCardSliderRecord
			...OnStatsRecord
		}
	}
}
