query Info {
  infoPage {
    title
    slug
    seoMetaTags: _seoMetaTags {
      attributes
      tag
      content
    }
    heroTitle {
      links {
        ...OnEmojiRecord
      }
      value
    }
    content {
      ...OnQuoteRecord
      ...OnTextHalfRecord
      ...OnTextLeadRecord
      ...OnMediaSingleRecord
      ...OnMediaMultipleRecord
      ...OnCardSliderRecord
      ...OnStatsRecord
    }
  }
}
