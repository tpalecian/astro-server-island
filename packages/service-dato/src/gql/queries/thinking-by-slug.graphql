query ThinkingBySlug($slug: String!) {
  thinking(filter: { slug: { eq: $slug } }) {
    ...Type
    title
    author {
      name
    }
    publishDate
    heroTitle {
      links {
        ...OnEmojiRecord
      }
      value
    }
    tags {
      name
      cards {
        ...Card
      }
    }
    slug
    seoMetaTags: _seoMetaTags {
      attributes
      tag
      content
    }
    content {
      ...OnQuoteRecord
      ...OnTextHalfRecord
      ...OnTextLeadRecord
      ...OnMediaSingleRecord
      ...OnMediaMultipleRecord
      ...OnCardSliderRecord
      ...OnStatsRecord
    }
  }
}
