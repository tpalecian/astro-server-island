query WorkBySlug($slug: String!) {
  work(filter: { slug: { eq: $slug } }) {
    ...Type
    title
    publishDate: _publishedAt
    introduction {
      links {
        ...OnEmojiRecord
      }
      value
    }
    client {
      name
      site
    }
    heroTitle {
      links {
        ...OnEmojiRecord
      }
      value
    }
    heroImage {
      ...Media
    }
    tags {
      name
      cards {
        ...Card
      }
    }
    slug
    seoMetaTags: _seoMetaTags {
      attributes
      tag
      content
    }
    content {
      ...OnQuoteRecord
      ...OnTextHalfRecord
      ...OnTextLeadRecord
      ...OnMediaSingleRecord
      ...OnMediaMultipleRecord
      ...OnCardSliderRecord
      ...OnStatsRecord
    }
  }
}
